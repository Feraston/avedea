name: Deploy to GitHub Pages

on:
  push:
    branches: [master, main, redesign]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current design (site root)
        uses: actions/checkout@v4
        with:
          ref: master
          path: site-current

      - name: Checkout redesign (/new preview)
        uses: actions/checkout@v4
        with:
          ref: redesign
          path: site-new

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            site-current/package-lock.json
            site-new/package-lock.json

      - name: Build current design → /
        working-directory: site-current
        run: |
          npm ci
          npm run build

      - name: Build redesign → /new/
        working-directory: site-new
        env:
          NEXT_BASE_PATH: /new
        run: |
          npm ci
          npm run build

      - name: Merge static sites
        run: |
          mkdir -p dist
          cp -a site-current/out/. dist/
          mkdir -p dist/new
          cp -a site-new/out/. dist/new/
          # Custom domain for Pages
          if [ -f site-current/public/CNAME ]; then
            cp site-current/public/CNAME dist/CNAME
          elif [ -f site-new/public/CNAME ]; then
            cp site-new/public/CNAME dist/CNAME
          fi
          touch dist/.nojekyll
          echo "Root entries:" && ls dist | head
          echo "New entries:" && ls dist/new | head

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
